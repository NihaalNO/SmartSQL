<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col glass-background">
<!-- Top Navigation (Shell Implementation) -->
<header class="sticky top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-outline/10 shadow-sm">
<div class="flex justify-between items-center h-16 px-page-p max-w-container-max-xl mx-auto">
<div class="flex items-center gap-base">
<span class="text-title-lg font-display font-bold text-on-surface">SmartSQL</span>
</div>
<div class="flex items-center gap-md">
<a class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors" href="#">Sign In</a>
<button class="bg-primary-container text-on-primary-container font-label-lg text-label-lg px-md py-xs rounded-lg hover:scale-95 transition-transform">Get Started</button>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-page-p py-3xl">
<div class="w-full max-w-container-max-sm flex flex-col items-center">
<!-- Brand & Heading Cluster -->
<div class="mb-2xl text-center">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-lg shadow-lg mx-auto">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" data-icon="database">database</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-xs">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to your SmartSQL analytics dashboard.</p>
</div>
<!-- Login Card -->
<div class="w-full bg-surface border border-outline rounded-lg shadow-sm p-page-padding">
<form class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-md" data-icon="mail">mail</span>
<input class="w-full pl-11 pr-md py-sm bg-surface border border-outline rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none font-body-md text-body-md" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline underline-offset-4" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-md" data-icon="lock">lock</span>
<input class="w-full pl-11 pr-md py-sm bg-surface border border-outline rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-lg text-label-lg py-sm rounded-lg hover:shadow-lg hover:translate-y-[-2px] active:scale-95 transition-all duration-200 shadow-md" type="submit">
                        Sign In
                    </button>
<!-- Divider -->
<div class="relative py-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="bg-surface px-md text-on-surface-variant font-label-sm uppercase tracking-wider">Or continue with</span>
</div>
</div>
<!-- Secondary Option (Google) -->
<button class="w-full flex items-center justify-center gap-md border border-outline bg-surface py-sm rounded-lg hover:bg-surface-container-low transition-all duration-200 font-label-lg text-label-lg text-on-surface group" type="button">
<svg class="w-5 h-5 group-hover:scale-110 transition-transform" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.16H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.84l3.66-2.75z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.16l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Sign in with Google
                    </button>
</form>
</div>
<!-- Footer Link -->
<p class="mt-2xl font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-title-sm hover:underline underline-offset-4" href="#">Create an account</a>
</p>
</div>

<footer class="w-full py-xl bg-surface border-t border-outline">
<div class="max-w-container-max-xl mx-auto px-page-p flex flex-col md:flex-row justify-between items-center gap-md">
<span class="text-title-md font-display font-bold text-on-surface">SmartSQL</span>
<div class="flex flex-wrap justify-center gap-lg">
<a class="font-label-md text-label-md text-on-secondary-container hover:text-on-surface hover:underline decoration-primary underline-offset-4 transition-all" href="#">Privacy Policy</a>
<a class="font-label-md text-label-md text-on-secondary-container hover:text-on-surface hover:underline decoration-primary underline-offset-4 transition-all" href="#">Terms of Service</a>
